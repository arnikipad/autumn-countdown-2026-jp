<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="2026年 秋のカウントダウン — 日本語版 v5.0">
  <title>2026年 秋のカウントダウン | v5.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <span class="leaf leaf1">🍂</span><span class="leaf leaf2">🍁</span><span class="leaf leaf3">🍂</span>
    <span class="leaf leaf4">🍁</span><span class="leaf leaf5">🍂</span><span class="leaf leaf6">🍁</span>
    <div class="sun"></div>
    <div class="lower-glow"></div>
  </div>

  <main class="wrap">
    <section class="card">
      <div class="version">AUTUMN COUNTDOWN • v5.0</div>

      <div class="eyes" aria-label="秋の目のロゴ">
        <span class="eye"><i></i></span>
        <span class="eye"><i></i></span>
      </div>

      <p class="eyebrow">北半球の天文学的な秋</p>
      <h1>2026年 秋のカウントダウン</h1>
      <p class="subtitle">秋分の日まで</p>

      <div class="countdown" aria-label="秋分の日まであと10日">
        <strong>10</strong><span>日</span>
      </div>

      <div class="date-box">
        <div><b>2026年9月22日（火）</b><br>午後8時05分（EDT）</div>
        <div><b>2026年9月23日（水）</b><br>午前0時05分（UTC）</div>
      </div>

      <div class="details">
        <p>🍂 気象学的な秋：9月1日〜11月30日</p>
        <p>☀️ 夏時間終了：11月1日</p>
        <p>🦃 アメリカの感謝祭：11月26日</p>
      </div>

      <footer>CSSアニメーション • ガラスモーフィズム • GitHub Pages対応</footer>
    </section>
  </main>
</body>
</html>
